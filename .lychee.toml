# Lychee link checker configuration

# Exclude patterns
exclude = [
  # Localhost/development URLs
  "http://localhost:*",
  "https://localhost:*",
  "http://127.0.0.1:*",
  "http://0.0.0.0:*",

  # Placeholder/example URLs
  "https://<your-*",
  "http://<your-*",

  # Private/internal URLs
  "file:///*",

  # Preview deployments that are ephemeral
  "https://*.vercel.app",

  # GitHub blob anchors and dynamic artifacts can be unstable
  "https://github.com/.*/blob/.*#.*",
  "https://results-receiver.actions.githubusercontent.com/.*",

  # Slack/webhook placeholders
  "https://hooks.slack.com/services/.*",
]

# Accept status codes
accept = [200, 201, 204, 301, 302, 307, 308]

# Timeout in seconds
timeout = 20

# Retry count
max_retries = 2
retry_wait_time = 1000
