name: CI Smoke

on:
  push:
    branches: [ main, feat/upload-hardening ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Health route sanity (dev)
        run: |
          npm run dev &
          n=0
          until curl -sf http://localhost:3000/api/health || [ $n -ge 25 ]; do n=$((n+1)); sleep 1; done
          curl -sf http://localhost:3000/api/health | tee health.json
          grep '"ok":true' health.json
      - name: Stop dev server
        run: pkill -f "next dev" || true
