name: main app health check

on:
  push:
    paths:
      - 'app/**'
      - 'src/app/**'
      - 'package.json'
      - 'next.config.*'
      - '.github/actions/smoke/**'
  pull_request:
    paths:
      - 'app/**'
      - 'src/app/**'
      - 'package.json'
      - 'next.config.*'
      - '.github/actions/smoke/**'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (if needed)
        run: |
          if [ -f package.json ] && jq -e '.scripts.build' package.json >/dev/null 2>&1; then
            npm run build
          else
            echo "No build script; skipping"
          fi

      - name: Start server
        env:
          PORT: 3000
        run: |
          if jq -e '.scripts.start' package.json >/dev/null 2>&1; then
            nohup npm start >/tmp/server.log 2>&1 &
            for i in {1..30}; do
              curl -fsS "http://127.0.0.1:3000/api/health" && break || sleep 1
            done
            curl -fsS "http://127.0.0.1:3000/api/health"
          else
            echo "No start script; assuming Next.js via npx next start"
            nohup npx next start >/tmp/server.log 2>&1 &
            for i in {1..30}; do
              curl -fsS "http://127.0.0.1:3000/api/health" && break || sleep 1
            done
            curl -fsS "http://127.0.0.1:3000/api/health"
          fi

      - name: Upload sanity test
        run: |
          echo "tiny" > /tmp/test.pdf
          curl -fsS -X POST \
            -F "doc=@/tmp/test.pdf;type=application/pdf" \
            -F "note=ci" \
            "http://127.0.0.1:3000/api/upload" | tee /tmp/upload.json
          node -e 'const r=require("fs").readFileSync("/tmp/upload.json","utf8"); const j=JSON.parse(r); if(!(j.ok && j.count===1)) { console.error(j); process.exit(1); }'
