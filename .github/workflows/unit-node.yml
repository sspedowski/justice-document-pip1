name: Node core unit tests
on:
  push:
  pull_request:
jobs:
  node-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run node --test
        run: node --test --test-reporter=spec tests-node
