name: "docs: link check"

on:
  pull_request:
    paths:
      - README.md
      - HELP.md
      - HELP_IMPLEMENTATION_SUMMARY.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docs: link check
        uses: lycheeverse/lychee-action@v1
        with:
          args: --config .lychee.toml --no-progress .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}