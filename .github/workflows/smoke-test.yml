name: Smoke Test

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        type: string
        required: true
        description: "Base URL to probe"
      with_bypass:
        type: boolean
        default: false
        description: "Use bypass token(s) if configured"

permissions:
  contents: read

jobs:
  smoke:
    name: SSE Smoke Test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    steps:
      - name: Determine target URL
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "url=${{ inputs.base_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ github.event.deployment_status.target_url }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute optional bypass
        id: bypass
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
          VERCEL_SSO_BYPASS: ${{ secrets.VERCEL_SSO_BYPASS }}
        run: |
          if [[ "${{ inputs.with_bypass }}" == "true" && ( -n "${VERCEL_BYPASS_TOKEN}" || -n "${VERCEL_SSO_BYPASS}" ) ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke SSE summarize endpoint
        continue-on-error: true
        env:
          SITE_URL: ${{ steps.target.outputs.url }}
          VERCEL_BYPASS_TOKEN: ${{ steps.bypass.outputs.enabled == 'true' && secrets.VERCEL_BYPASS_TOKEN || '' }}
          VERCEL_SSO_BYPASS:   ${{ steps.bypass.outputs.enabled == 'true' && secrets.VERCEL_SSO_BYPASS || '' }}
        run: |
          set -euo pipefail
          echo "Testing SSE endpoint at $SITE_URL/api/summarize/stream"

          OPTS=()
          if [[ -n "${VERCEL_BYPASS_TOKEN}" ]]; then
            OPTS+=("-H" "x-vercel-protection-bypass: ${VERCEL_BYPASS_TOKEN}")
            SITE_URL="${SITE_URL}?vercel-protection-bypass=${VERCEL_BYPASS_TOKEN}"
          fi
          if [[ -n "${VERCEL_SSO_BYPASS}" ]]; then
            OPTS+=("-H" "x-vercel-sso-bypass: ${VERCEL_SSO_BYPASS}")
            if [[ "${SITE_URL}" == *"?"* ]]; then SEP='&'; else SEP='?'; fi
            SITE_URL="${SITE_URL}${SEP}vercel-sso-bypass=${VERCEL_SSO_BYPASS}"
          fi

          RESP=$(curl -s -N -X POST \
            -H 'Accept: text/event-stream' \
            -H 'Content-Type: application/json' \
            ${OPTS[@]:-} \
            -d '{"text":"CI smoke test"}' \
            "$SITE_URL/api/summarize/stream" | head -n 30)

          echo "Response:"
          echo "$RESP"

          # Check for SSE format
          echo "$RESP" | grep -E '(^data:|^event:|^: )' >/dev/null || {
            echo "ERROR: Response is not valid SSE format"
            exit 1
          }

          # Check for start or done stage
          echo "$RESP" | grep -E '"stage":"(start|done)"' >/dev/null || {
            echo "ERROR: No start or done stage found in response"
            exit 1
          }

          echo "✅ SSE smoke test passed"

      - name: Guidance for protected previews
        if: failure()
        run: |
          echo "::notice title=Protected preview detected::If the SSE smoke failed due to preview_protection, run the 'Manual Smoke' workflow with with_bypass=true and ensure the VERCEL_BYPASS_TOKEN secret is set."
