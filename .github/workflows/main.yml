# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: ci
      JWT_SECRET: testjwt
      SESSION_SECRET: testsession
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: adminpass
      OPENAI_API_KEY: test-openai-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"

      - name: Install root deps
        run: npm ci

      - name: Install backend deps
        working-directory: justice-server
        run: npm ci

      - name: Install frontend deps (if present)
        working-directory: justice-dashboard
        run: npm ci || true

      - name: Unit tests (if present)
        run: |
          npm test --if-present || npm run test:unit --if-present || echo "no test script"

      - name: Build (if present)
        run: npm run build --if-present || echo "no build script"

      - name: Start backend (background) & wait for health
        working-directory: justice-server
        run: |
          npm start &
          echo $! > ../backend.pid
          timeout 60 bash -c 'until curl -fsS http://localhost:3000/api/health; do sleep 1; done'

      - name: API smoke checks
        run: |
          curl -fsS http://localhost:3000/api/health
          curl -fsS -X POST http://localhost:3000/api/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"adminpass"}'

      - name: Stop backend
        if: always()
        run: |
          kill "$(cat backend.pid)" 2>/dev/null || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"

      - name: Install deps
        run: |
          npm ci
          cd justice-server && npm ci
          cd ../justice-dashboard && npm ci || true

      - name: Build frontend (if present)
        working-directory: justice-dashboard
        run: npm run build --if-present || echo "no build script"

      - name: Deploy to Render
        if: success()
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deployment..."
            curl -X POST "$RENDER_DEPLOY_HOOK"
            echo "✅ Deployed to Render"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK not configured, skipping Render deployment"
          fi

      - name: Deploy to Vercel
        if: success()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "Deploying to Vercel..."
            npx vercel --token "$VERCEL_TOKEN" --prod --yes
            echo "✅ Deployed to Vercel"
          else
            echo "⚠️ VERCEL_TOKEN not configured, skipping Vercel deployment"
          fi

      - name: Deployment Summary
        run: |
          echo "Deployment Summary:" 
          echo "✅ Build completed successfully" 
          echo "To enable auto-deploy, add GitHub Secrets:" 
          echo " - RENDER_DEPLOY_HOOK (for Render)" 
          echo " - VERCEL_TOKEN (for Vercel)"
