# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# cSpell:ignore testjwt testsession adminpass

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: ci
      JWT_SECRET: testjwt
      SESSION_SECRET: testsession
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: adminpass
      OPENAI_API_KEY: test-openai-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.x'

      - name: Install Root Dependencies
        run: npm install

      - name: Install Backend Dependencies
        working-directory: justice-server
        run: npm install

      - name: Install Frontend Dependencies
        working-directory: justice-dashboard
        run: npm install

      - name: Validate Environment
        run: npm run validate || true

      - name: Build Next.js app
        run: npm run build

      - name: Start Backend
        run: |
          nohup npm start &
          sleep 10
          timeout 30 bash -c 'until curl --fail http://localhost:3000/api/health; do sleep 2; done'

      - name: Test Login Endpoint
        run: |
          curl --fail -X POST http://localhost:3000/api/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"adminpass"}'

      - name: Run Tests
        run: npm test
        continue-on-error: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.x'

      - name: Install Dependencies
        run: npm install

      - name: Install Backend Dependencies
        working-directory: justice-server
        run: npm install

      - name: Install Frontend Dependencies
        working-directory: justice-dashboard
        run: npm install

      - name: Build Frontend
        working-directory: justice-dashboard
        run: npm run build || echo "No build script found"

      - name: Deploy to Render
        if: success()
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }} # yamllint disable-line
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "🚀 Triggering Render deployment..."
            curl -X POST "$RENDER_DEPLOY_HOOK"
            echo "✅ Deployed to Render"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK not configured, skipping Render deployment"
          fi

      - name: Deploy to Vercel
        if: success()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "🚀 Deploying to Vercel..."
            npx vercel --token "$VERCEL_TOKEN" --prod --yes
            echo "✅ Deployed to Vercel"
          else
            echo "⚠️ VERCEL_TOKEN not configured, skipping Vercel deployment"
          fi

      - name: Deployment Summary
        run: |
          echo "📋 Deployment Summary:"
          echo "✅ Build completed successfully"
          echo "📝 To enable auto-deploy, add GitHub Secrets:"
          echo "   - RENDER_DEPLOY_HOOK (for Render)"
          echo "   - VERCEL_TOKEN (for Vercel)"
