name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Build dashboard (Vite) + copy (tolerant)
        shell: bash
        run: |
          pnpm run build:dashboard:bundle
          pnpm run build:dashboard:copy
          if [ -d justice-dashboard/dist ]; then
            test -f public/dashboard/index.html
          else
            echo "No Vite dist; placeholder created. Skipping strict assertion."
          fi
      - name: Build Next.js
        run: pnpm run build

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint -- --max-warnings=0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  audit:
    name: Security Audit (production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit (production only, HIGH+)
        run: pnpm audit --prod --audit-level=high
