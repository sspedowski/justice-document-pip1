name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Root (Next.js)
      - name: Install root deps
        run: npm ci
      - name: Lint root
        run: npm run lint --if-present
      - name: Build root
        run: npm run build --if-present
      - name: Probe /dashboard
        run: |
          npx next start -p 4000 &
          sleep 2
          curl -sSf http://localhost:4000/dashboard > /dev/null

      # Vite subapp
      - name: Install Vite deps
        run: npm --prefix justice-dashboard install
      - name: Build Vite
        run: npm --prefix justice-dashboard run build
      - name: Test Vite
        run: npm --prefix justice-dashboard run test:run

