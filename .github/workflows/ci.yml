name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
            justice-dashboard/package-lock.json

      - name: Detect dashboard workspace
        id: detect_dashboard
        run: |
          if [ -d dashboard ]; then
            echo "DASHBOARD_DIR=dashboard" >> $GITHUB_ENV
            echo "DASHBOARD_DIR=dashboard" >> $GITHUB_OUTPUT
          elif [ -d justice-dashboard ]; then
            echo "DASHBOARD_DIR=justice-dashboard" >> $GITHUB_ENV
            echo "DASHBOARD_DIR=justice-dashboard" >> $GITHUB_OUTPUT
          else
            echo "DASHBOARD_DIR=" >> $GITHUB_ENV
            echo "DASHBOARD_DIR=" >> $GITHUB_OUTPUT
          fi

      # Root (Next.js)
      - name: Install root deps
        run: npm ci
      - name: Lint root
        run: npm run lint --if-present

      # Dashboard (Vite) optional
      - name: Install dashboard deps
        if: ${{ steps.detect_dashboard.outputs.DASHBOARD_DIR != '' }}
        run: npm --prefix "${{ steps.detect_dashboard.outputs.DASHBOARD_DIR }}" ci
      - name: Lint dashboard
        if: ${{ steps.detect_dashboard.outputs.DASHBOARD_DIR != '' }}
        run: npm --prefix "${{ steps.detect_dashboard.outputs.DASHBOARD_DIR }}" run lint --if-present
      - name: Build dashboard
        if: ${{ steps.detect_dashboard.outputs.DASHBOARD_DIR != '' }}
        run: npm --prefix "${{ steps.detect_dashboard.outputs.DASHBOARD_DIR }}" run build --if-present
      - name: Publish Vite dashboard into Next public (Linux)
        if: ${{ steps.detect_dashboard.outputs.DASHBOARD_DIR != '' }}
        run: npm run publish:dashboard:posix
      - name: Typecheck dashboard
        if: ${{ steps.detect_dashboard.outputs.DASHBOARD_DIR != '' }}
        run: npm --prefix "${{ steps.detect_dashboard.outputs.DASHBOARD_DIR }}" run typecheck --if-present
      - name: Test dashboard
        if: ${{ steps.detect_dashboard.outputs.DASHBOARD_DIR != '' }}
        run: npm --prefix "${{ steps.detect_dashboard.outputs.DASHBOARD_DIR }}" run test:run --if-present

      # Build Next after publishing dashboard assets
      - name: Build Next
        run: npm run build
      - name: Typecheck Next (optional)
        run: npm run typecheck --if-present

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
            justice-dashboard/package-lock.json

      - name: Detect dashboard workspace
        id: detect_dashboard
        run: |
          if [ -d dashboard ]; then
            echo "DASHBOARD_DIR=dashboard" >> $GITHUB_ENV
            echo "DASHBOARD_DIR=dashboard" >> $GITHUB_OUTPUT
          elif [ -d justice-dashboard ]; then
            echo "DASHBOARD_DIR=justice-dashboard" >> $GITHUB_ENV
            echo "DASHBOARD_DIR=justice-dashboard" >> $GITHUB_OUTPUT
          else
            echo "DASHBOARD_DIR=" >> $GITHUB_ENV
            echo "DASHBOARD_DIR=" >> $GITHUB_OUTPUT
          fi

      - name: Install root deps
        run: npm ci
      - name: Install dashboard deps
        if: ${{ steps.detect_dashboard.outputs.DASHBOARD_DIR != '' }}
        run: npm --prefix "${{ steps.detect_dashboard.outputs.DASHBOARD_DIR }}" ci
      - name: Build dashboard
        if: ${{ steps.detect_dashboard.outputs.DASHBOARD_DIR != '' }}
        run: npm --prefix "${{ steps.detect_dashboard.outputs.DASHBOARD_DIR }}" run build --if-present
      - name: Publish Vite dashboard into Next public (Linux)
        if: ${{ steps.detect_dashboard.outputs.DASHBOARD_DIR != '' }}
        run: npm run publish:dashboard:posix
      - name: Build Next
        run: npm run build
      - name: Start Next.js server
        run: |
          PORT=3021 npm run start &
          NEXT_PID=$!
          cleanup() {
            if kill -0 "$NEXT_PID" 2>/dev/null; then
              kill "$NEXT_PID"
            fi
          }
          trap cleanup EXIT
          for i in {1..30}; do
            if curl -fsS "http://localhost:3021/api/health" >/dev/null; then
              # Ensure dashboard trailing-slash redirect resolves
              curl -fsS -I "http://localhost:3021/dashboard" | grep -q "^HTTP/.* 308" || exit 1
              curl -fsS "http://localhost:3021/dashboard/" >/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "Next.js server did not start/respond on port 3021" >&2
          exit 1
