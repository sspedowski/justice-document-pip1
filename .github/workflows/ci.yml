name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"
      # If your build references these, harmless empties avoid crashes:
      NEXT_PUBLIC_FIREBASE_API_KEY: ""
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ""
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ""
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ""
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ""
      NEXT_PUBLIC_FIREBASE_APP_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run test:node
      - run: npm run build

  probe-dashboard:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Start Next.js server and probe /dashboard
        run: |
          npx next start -p 4000 &
          npx wait-port 4000
          echo "Probing http://localhost:4000/dashboard..."
          curl -sSf http://localhost:4000/dashboard > /dev/null
          echo "✅ Dashboard is available."