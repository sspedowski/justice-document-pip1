name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep memory reasonable for Next build
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: Lint, typecheck, build (+optional dashboard publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (if present)
        run: |
          if npm run | grep -q "^  lint"; then npm run lint; else echo "no lint script"; fi

      - name: Typecheck (if present)
        run: |
          if npm run | grep -q "typecheck"; then npm run typecheck; else echo "no typecheck script"; fi

      - name: Unit tests (if present)
        run: |
          if npm run | grep -q "^  test$"; then npm test;
          elif npm run | grep -q "^  test:unit$"; then npm run test:unit;
          else echo "no test script"; fi

      - name: Build dashboard (optional) and publish into Next public
        shell: bash
        run: |
          set -e
          if npm run | grep -q "build:dashboard"; then npm run build:dashboard; else echo "no build:dashboard script"; fi
          if [ -f scripts/publish-dashboard.sh ]; then bash scripts/publish-dashboard.sh; else echo "no publish-dashboard.sh"; fi
          if [ -f scripts/publish-dashboard.ps1 ]; then pwsh -File scripts/publish-dashboard.ps1; else echo "no publish-dashboard.ps1"; fi

      - name: Build Next app
        run: npm run build

  smoke:
    name: Start & probe server
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Start server
        run: |
          (npm start -- -p 3021 &)
          for i in {1..30}; do
            if curl -fsS http://localhost:3021/api/health >/dev/null; then
              echo "Health OK"; exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy" >&2
          exit 1

      - name: Probe common routes
        run: |
          curl -fsS http://localhost:3021/ >/dev/null
          curl -fsS http://localhost:3021/api/health

  integration:
    name: Secret-gated integration checks
    # Run only if core secrets exist AND (push to main OR PR labeled run-integration)
    if: >
      ${{ 
        (secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.GOOGLE_API_KEY != '') &&
        (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-integration'))) 
      }}
    runs-on: ubuntu-latest
    needs: smoke
    timeout-minutes: 15

    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      APP_CHECK_TOKEN: ${{ secrets.APP_CHECK_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Start server
        run: (npm start -- -p 3021 &)

      - name: Wait for health
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:3021/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Server did not become healthy" >&2
          exit 1

      - name: RTDB ping (if implemented)
        run: |
          if curl -fsS http://localhost:3021/api/rtdb/ping >/dev/null; then
            echo "RTDB ping OK"
          else
            echo "No /api/rtdb/ping route; skipping"
          fi

      - name: Upstash smoke (if configured)
        if: ${{ secrets.UPSTASH_REDIS_REST_URL != '' && secrets.UPSTASH_REDIS_REST_TOKEN != '' }}
        run: |
          curl -fsS "$UPSTASH_REDIS_REST_URL/GET/health" \
            -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" || echo "Upstash check skipped"
