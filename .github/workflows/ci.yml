name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect package manager
        id: pkg
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
          elif [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pkg.outputs.manager }}

      - name: Install dependencies
        run: |
          if [ "${{ steps.pkg.outputs.manager }}" = "pnpm" ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ "${{ steps.pkg.outputs.manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Typecheck
        run: |
          if [ -f "node_modules/.bin/tsc" ]; then
            npx tsc --noEmit
          else
            echo "No TypeScript detected, skipping"
          fi

      - name: Test (CI)
        run: |
          if npm run -s | grep -q "^  test:ci$"; then
            npm run -s test:ci
          elif npm run -s | grep -q "^  test$"; then
            npm run -s test -- --run || echo "Tests failed or none found; continuing"
          else
            echo "No test script; skipping"
          fi

      - name: Build
        run: |
          if npm run -s | grep -q "^  build$"; then
            npm run -s build
          else
            echo "No build script; skipping"
          fi
