name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Publish dashboard
        run: node scripts/publish-dashboard.mjs ./dashboard ./justice-dashboard ./public/dashboard
      - name: Build
        run: npm run build
      - name: Start server
        run: npm start &
      - name: Run Vitest
        run: npm run test:unit
      - name: Run Playwright
        run: npm run e2e
      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: vitest-report/
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
