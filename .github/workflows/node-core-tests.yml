name: node-core-tests

on:
  pull_request:
  push:
    branches:
      - main
      - feat/streaming-progress

permissions:
  contents: read

jobs:
  node-core:
    name: Node core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Run node core tests
        run: npm run test:unit-node
