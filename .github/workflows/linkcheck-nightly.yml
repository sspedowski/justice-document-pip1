name: Nightly Link Check (Strict)

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  linkcheck_full:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - name: Lychee (strict)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 20 --retry-wait-time 2
            --timeout 20 --config .lychee.toml --fail
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
