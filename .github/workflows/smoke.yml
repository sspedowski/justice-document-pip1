name: Manual Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to probe (e.g., https://your-app.vercel.app)"
        required: true
        type: string
      with_bypass:
        description: "Send Vercel protection bypass token header"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Preflight: if bypass requested but secret is missing, fail fast with a clear message.
      - name: Verify bypass secret present (only when requested)
        if: ${{ inputs.with_bypass == true }}
        run: |
          if (-not $env:VERCEL_BYPASS_TOKEN -or $env:VERCEL_BYPASS_TOKEN.Trim().Length -eq 0) {
            Write-Error "with_bypass=true but secret VERCEL_BYPASS_TOKEN is not set."
          }
        env:
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}

      # Runs with the Vercel bypass header if requested.
      - name: Run smoke (with bypass)
        if: ${{ inputs.with_bypass == true }}
        env:
          BASE_URL: ${{ inputs.base_url }}
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
        run: |
          if (-not (Test-Path ./tools/smoke.ps1)) { Write-Error "tools/smoke.ps1 not found"; exit 1 }
          ./tools/smoke.ps1 -BaseUrl "$env:BASE_URL" -BypassToken "$env:VERCEL_BYPASS_TOKEN" *>&1 | Tee-Object -FilePath smoke.log

      # Default: runs without the header.
      - name: Run smoke
        if: ${{ inputs.with_bypass != true }}
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          if (-not (Test-Path ./tools/smoke.ps1)) { Write-Error "tools/smoke.ps1 not found"; exit 1 }
          ./tools/smoke.ps1 -BaseUrl "$env:BASE_URL" *>&1 | Tee-Object -FilePath smoke.log

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log

      - name: Job summary
        if: always()
        run: |
          "### Smoke results (tail)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          (Get-Content smoke.log -Tail 200) -join "`n" | Out-File -Append $env:GITHUB_STEP_SUMMARY
