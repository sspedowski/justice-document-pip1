name: Vite CI
on: [pull_request, push]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: justice-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:ci
