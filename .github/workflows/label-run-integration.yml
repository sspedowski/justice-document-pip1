name: "PR Label: run-integration"
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  toggle:
    if: >-
      ${{ github.event.issue.pull_request &&
          (contains(github.event.comment.body, '/integration') ||
           contains(github.event.comment.body, '/integration off')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.issue;
            const body = context.payload.comment.body.toLowerCase();
            const label = 'run-integration';
            if (body.includes('/integration off')) {
              await github.rest.issues.removeLabel({ ...issue, name: label }).catch(()=>{});
              core.info('Removed run-integration');
            } else if (body.includes('/integration')) {
              await github.rest.issues.addLabels({ ...issue, labels: [label] });
              core.info('Added run-integration');
            }
