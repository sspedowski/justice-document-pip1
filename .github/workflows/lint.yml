name: Lint

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**/*.{js,jsx,ts,tsx}"
      - "justice-dashboard/src/**/*.{js,jsx,ts,tsx}"
      - "justice-dashboard/**/*.{js,jsx,ts,tsx}"
      - "eslint.config.js"
      - "eslint.config.mjs"
      - ".eslintrc.*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "frontend/**/*.{js,jsx,ts,tsx}"
      - "justice-dashboard/src/**/*.{js,jsx,ts,tsx}"
      - "justice-dashboard/**/*.{js,jsx,ts,tsx}"
      - "eslint.config.js"
      - "eslint.config.mjs"
      - ".eslintrc.*"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/lint.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: 'pnpm'
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ github.ref_name }}-${{ hashFiles('eslint.config.js', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            eslint-${{ github.ref_name }}-
            eslint-
      - run: pnpm install --frozen-lockfile
      - run: echo "::add-matcher::.github/eslint-problem-matcher.json"
      - name: ESLint (annotated)
        run: pnpm run lint
