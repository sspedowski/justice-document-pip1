name: pr: hardening progress comment
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled]
permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  update-comment:
    if: contains(toJson(github.event.pull_request.labels), 'hardening')
    runs-on: ubuntu-latest
    steps:
      - name: Upsert progress comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const total = (body.match(/- \[( |x)\]/g) || []).length;
            const done  = (body.match(/- \[x\]/g)   || []).length;
            const pct   = total ? Math.round(done/total*100) : 0;

            const header = `<!-- hardening-progress -->\n` +
              `**Hardening progress:** ${done}/${total} (${pct}%)\n\n`;
            const checklist = body.split('\n').filter(l => l.startsWith('- [')).join('\n') || '_No checklist found in PR body._';
            const commentBody = `${header}${checklist}\n\n_Last updated: ${new Date().toISOString()}_`;

            const issue_number = pr.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number, per_page: 100
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body?.includes('<!-- hardening-progress -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, body: commentBody
              });
            }

